name: Qoder Daily

on:
  # 北京时间每天 10:20，国际版活动在 10:00 开放（cron 使用 UTC）。
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Qoder-Daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run Qoder Daily
        env:
          QODER_TOKENS: ${{ secrets.QODER_TOKENS }}
          QODER_GLOBAL_TOKENS: ${{ secrets.QODER_GLOBAL_TOKENS }}
          QODER_MACHINE_TOKEN: ${{ secrets.QODER_MACHINE_TOKEN }}
          QODER_MACHINE_CODE: ${{ secrets.QODER_MACHINE_CODE }}
          QODER_MACHINE_TYPE: ${{ secrets.QODER_MACHINE_TYPE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python qoder_daily.py
